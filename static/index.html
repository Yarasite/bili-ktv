<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#111318">
<title>B站点歌台</title>
<style>
  :root {
    --bg: #111318; --card: #1b1e26; --line: #2a2e39; --text: #e9ebf0; --sub: #8b91a1;
    --pink: #fb7299; --blue: #23ade5; --danger: #ff5d5d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    padding: 12px 12px calc(24px + env(safe-area-inset-bottom));
  }
  header { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 12px; }
  h1 { font-size: 20px; margin: 0; }
  h1 span { color: var(--pink); }
  .conn { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); display: inline-block; }
  .conn.on i { background: #3ccf7a; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card h2 small { color: var(--sub); font-weight: normal; font-size: 12px; }
  textarea, input {
    width: 100%; background: #0e1015; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; font: inherit; outline: none;
  }
  textarea:focus, input:focus { border-color: var(--pink); }
  textarea { resize: none; height: 72px; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .row input { flex: 1; min-width: 0; }
  button {
    border: 0; border-radius: 10px; padding: 10px 14px; font: inherit; color: var(--text);
    background: #2a2e39; cursor: pointer; white-space: nowrap;
  }
  button:active { opacity: .7; }
  button:disabled { opacity: .35; }
  button.primary { background: var(--pink); color: #fff; font-weight: 600; min-width: 92px; }
  button.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
  button.danger { color: var(--danger); }
  .now { display: flex; gap: 12px; }
  .cover { width: 128px; aspect-ratio: 16/10; border-radius: 8px; object-fit: cover; background: #0e1015; flex-shrink: 0; }
  .meta { min-width: 0; flex: 1; }
  .title { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .sub { color: var(--sub); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .by { color: var(--blue); }
  .progress { margin-top: 12px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--pink); transition: width .5s linear; }
  .times { display: flex; justify-content: space-between; color: var(--sub); font-size: 12px; margin-top: 4px; }
  .controls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
  .controls button { padding: 10px 0; font-size: 14px; }
  .controls .next { background: var(--pink); color: #fff; }
  .empty { color: var(--sub); text-align: center; padding: 18px 0; font-size: 14px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  li .idx { width: 22px; text-align: center; color: var(--sub); font-size: 13px; flex-shrink: 0; }
  li .cover { width: 72px; border-radius: 6px; }
  li .title { font-size: 14px; font-weight: 500; }
  li .ops { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  details summary { cursor: pointer; color: var(--sub); font-size: 14px; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary { margin-bottom: 6px; }
  #toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: rgba(40,44,56,.96); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px;
    max-width: 86vw; opacity: 0; pointer-events: none; transition: all .25s; z-index: 10; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: rgba(160,40,50,.96); }
</style>
</head>
<body>
<header>
  <h1><span>B站</span>点歌台</h1>
  <div class="conn" id="conn"><i></i><span>连接中…</span></div>
</header>

<section class="card">
  <h2>点歌 <small>支持 B 站链接、App 分享文案、BV 号</small></h2>
  <textarea id="url" placeholder="在 B 站 App 点「分享 → 复制链接」，粘贴到这里"></textarea>
  <div class="row">
    <input id="nick" maxlength="20" placeholder="你的昵称">
    <button class="primary" id="addBtn">点歌</button>
  </div>
</section>

<section class="card">
  <h2>正在播放 <small id="nowBy"></small></h2>
  <div id="nowBox"></div>
</section>

<section class="card">
  <h2>
    <span>播放列表 <small id="qInfo"></small></span>
    <span>
      <button class="small" id="shuffleBtn">🔀 随机打乱</button>
      <button class="small danger" id="clearBtn">清空</button>
    </span>
  </h2>
  <ul id="queue"></ul>
</section>

<section class="card">
  <details id="histBox">
    <summary>🕘 最近播放（点「再点」可重新加入列表）</summary>
    <ul id="history"></ul>
  </details>
</section>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => {
  t = Math.max(0, Math.floor(t || 0));
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = String(t % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
};

let state = { now: null, queue: [], history: [] };
let player = {}, playerAt = 0;

const nickInput = $('#nick');
nickInput.value = localStorage.getItem('ktv_nick') || '';
nickInput.addEventListener('change', () => localStorage.setItem('ktv_nick', nickInput.value.trim()));

let toastTimer;
function toast(msg, err = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 2600);
}

async function api(path, body = {}) {
  const r = await fetch('/api/' + path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const d = await r.json().catch(() => ({ ok: false, error: '服务器无响应' }));
  if (!d.ok) throw new Error(d.error || '操作失败');
  return d;
}

async function run(path, body, okMsg) {
  try {
    const d = await api(path, body);
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(d) : okMsg);
    return d;
  } catch (e) {
    toast(e.message, true);
  }
}

const itemTitle = it => esc(it.title) + (it.part ? ` <span class="sub">P${it.page} ${esc(it.part)}</span>` : '');

function renderNow() {
  const it = state.now;
  $('#nowBy').innerHTML = it ? `由 <span class="by">${esc(it.added_by)}</span> 点播` : '';
  if (!it) {
    $('#nowBox').innerHTML = '<div class="empty">还没有歌，快来点一首吧 🎤</div>';
    return;
  }
  $('#nowBox').innerHTML = `
    <div class="now">
      <img class="cover" src="${esc(it.cover)}@320w_200h_1c.webp" alt="">
      <div class="meta">
        <div class="title">${itemTitle(it)}</div>
        <div class="sub">UP：${esc(it.owner)}</div>
      </div>
    </div>
    <div class="progress">
      <div class="bar"><div id="bar"></div></div>
      <div class="times"><span id="pos">0:00</span><span id="dur">${fmt(it.duration)}</span></div>
    </div>
    <div class="controls">
      <button data-ctl="seek" data-v="-10">⏪ 10s</button>
      <button data-ctl="toggle" id="toggleBtn">⏸ 暂停</button>
      <button data-ctl="seek" data-v="10">10s ⏩</button>
      <button data-ctl="restart">↺ 重播</button>
      <button class="next" id="nextBtn">⏭ 切歌</button>
    </div>
    <div class="controls" style="grid-template-columns: repeat(2, 1fr)">
      <button data-ctl="volume" data-v="-0.1">🔉 音量 -</button>
      <button data-ctl="volume" data-v="0.1">🔊 音量 +</button>
    </div>`;
  renderProgress();
}

function renderProgress() {
  const it = state.now, bar = $('#bar');
  if (!it || !bar) return;
  let pos = 0, dur = it.duration, paused = false;
  if (player.id === it.id) {
    paused = !!player.paused;
    dur = player.duration || dur;
    pos = (player.position || 0) + (paused ? 0 : (Date.now() - playerAt) / 1000);
  }
  pos = Math.min(pos, dur || pos);
  bar.style.width = dur ? (pos / dur * 100) + '%' : '0';
  $('#pos').textContent = fmt(pos);
  $('#dur').textContent = fmt(dur);
  $('#toggleBtn').textContent = paused ? '▶ 播放' : '⏸ 暂停';
}

function renderQueue() {
  const q = state.queue;
  const total = q.reduce((s, it) => s + (it.duration || 0), 0);
  $('#qInfo').textContent = q.length ? `${q.length} 首 · ${fmt(total)}` : '';
  $('#shuffleBtn').disabled = q.length < 2;
  $('#clearBtn').disabled = !q.length;
  $('#queue').innerHTML = q.length ? q.map((it, i) => `
    <li data-id="${esc(it.id)}">
      <div class="idx">${i + 1}</div>
      <img class="cover" src="${esc(it.cover)}@160w_100h_1c.webp" alt="" loading="lazy">
      <div class="meta">
        <div class="title">${itemTitle(it)}</div>
        <div class="sub">${fmt(it.duration)} · <span class="by">${esc(it.added_by)}</span></div>
      </div>
      <div class="ops">
        <button class="small" data-op="top" ${i === 0 ? 'disabled' : ''}>⤒ 置顶</button>
        <button class="small danger" data-op="remove">删除</button>
      </div>
    </li>`).join('') : '<div class="empty">列表空空的</div>';
}

function renderHistory() {
  const h = state.history;
  $('#history').innerHTML = h.length ? h.map(it => `
    <li data-id="${esc(it.id)}">
      <img class="cover" src="${esc(it.cover)}@160w_100h_1c.webp" alt="" loading="lazy">
      <div class="meta">
        <div class="title">${itemTitle(it)}</div>
        <div class="sub">${fmt(it.duration)} · <span class="by">${esc(it.added_by)}</span></div>
      </div>
      <div class="ops"><button class="small" data-op="replay">再点</button></div>
    </li>`).join('') : '<div class="empty">暂无记录</div>';
}

function render() {
  renderNow();
  renderQueue();
  renderHistory();
}

$('#addBtn').addEventListener('click', async () => {
  const url = $('#url').value.trim();
  if (!url) return toast('先粘贴一个 B 站视频链接', true);
  const nick = nickInput.value.trim();
  localStorage.setItem('ktv_nick', nick);
  const btn = $('#addBtn');
  btn.disabled = true; btn.textContent = '解析中…';
  const d = await run('add', { url, nick }, d => d.started ? `开始播放：${d.item.title}` : `已加入第 ${d.position} 首：${d.item.title}`);
  btn.disabled = false; btn.textContent = '点歌';
  if (d) $('#url').value = '';
});

$('#url').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#addBtn').click(); }
});

$('#nowBox').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || !state.now) return;
  if (b.id === 'nextBtn') return run('next', { id: state.now.id }, '已切到下一首');
  const value = b.dataset.v ? parseFloat(b.dataset.v) : undefined;
  run('control', { action: b.dataset.ctl, value });
});

$('#queue').addEventListener('click', e => {
  const b = e.target.closest('button[data-op]');
  if (!b) return;
  const id = b.closest('li').dataset.id;
  if (b.dataset.op === 'top') run('top', { id }, '已置顶');
  if (b.dataset.op === 'remove') run('remove', { id }, '已删除');
});

$('#history').addEventListener('click', e => {
  const b = e.target.closest('button[data-op="replay"]');
  if (!b) return;
  run('replay', { id: b.closest('li').dataset.id, nick: nickInput.value.trim() },
    d => d.started ? '开始播放' : `已加入第 ${d.position} 首`);
});

$('#shuffleBtn').addEventListener('click', () => run('shuffle', {}, '列表已随机打乱'));
$('#clearBtn').addEventListener('click', () => {
  if (confirm('确定清空整个播放列表吗？（不影响正在播放的歌）')) run('clear', {}, '列表已清空');
});

function setConn(on) {
  $('#conn').classList.toggle('on', on);
  $('#conn span').textContent = on ? '已连接' : '重连中…';
}

function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=remote`);
  ws.onopen = () => setConn(true);
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'state') {
      const changedSong = state.now?.id !== msg.now?.id;
      state = msg;
      if (changedSong) player = {};
      render();
    } else if (msg.type === 'player') {
      player = msg; playerAt = Date.now();
      renderProgress();
    }
  };
  ws.onclose = () => { setConn(false); setTimeout(connect, 1500); };
}

setInterval(renderProgress, 1000);
render();
connect();
</script>
</body>
</html>
